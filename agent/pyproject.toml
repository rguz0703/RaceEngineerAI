[project]
name = "raceengineer"
version = "0.0.1"
description = "RaceEngineerAI agent: telemetry capture, storage, analysis and API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
raceengineer = "raceengineer.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raceengineer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=raceengineer --cov-report=term-missing --cov-fail-under=80"
